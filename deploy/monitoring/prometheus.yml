# OpenAdult Prometheus 监控配置
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Node.js API Server
  - job_name: 'openadult-api'
    static_configs:
      - targets: ['app:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 10s

  # Nginx
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']

  # OpenResty CDN
  - job_name: 'openresty-cdn'
    static_configs:
      - targets: ['openresty:9145']

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # Node Exporter (系统指标)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

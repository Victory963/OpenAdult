# ============================================================
# OpenAdult JS Challenge 中间件
# 功能: 检测 js_verified cookie，未验证则重定向到 challenge 页面
# 用法: include /etc/nginx/conf.d/js-challenge.conf; (在 server 块内)
# ============================================================

# JS Challenge 验证逻辑
set $challenge_needed 0;

# 检查是否有验证 Cookie
if ($cookie_js_verified = "") {
    set $challenge_needed 1;
}

# 白名单路径 (不需要验证)
if ($uri = /health) {
    set $challenge_needed 0;
}
if ($uri = /challenge) {
    set $challenge_needed 0;
}
if ($uri ~* \.(css|js|png|jpg|ico|svg|woff2)$) {
    set $challenge_needed 0;
}

# 已知 Bot User-Agent 直接拒绝
if ($http_user_agent ~* (bot|crawler|spider|scraper|curl|wget|python-requests|Go-http-client)) {
    return 403;
}

# 需要验证时重定向到 challenge 页面
if ($challenge_needed = 1) {
    return 302 /challenge?return=$request_uri;
}

# ============================================================
# OpenAdult 本地/开发 Nginx 配置 (HTTP-only, 无 SSL, 无 Cloudflare 门禁)
# 用于 docker-compose.local.yml —— 让你在 localhost 直接浏览。
# 生产配置见 openadult-main.conf (SSL + Cloudflare 白名单)。
# app 自己就会提供 SPA + tRPC API，所以这里把所有请求都转发给 app:3000。
# ============================================================
server {
    listen 80;
    server_name _;
    client_max_body_size 500m;

    location / {
        proxy_pass http://app:3000;      # docker-compose 服务名
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ============================================================
# OpenAdult 主站 Nginx 配置
# 功能: 反向代理 Node.js 应用 + SSL + 安全头 + 速率限制
# 前置: Cloudflare CDN (SSL终止在CF层)
# ============================================================

# 速率限制区域
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;

# 上游 Node.js 应用
# NOTE: docker-compose 拓扑下 app 是独立容器。nginx 容器内的 127.0.0.1 指向 nginx 自身，
# 无法到达 app，会导致所有 /api 502。必须用 Docker 内部 DNS 服务名 `app:3000`
# （与 transcoder/domain-rotator 一致）。横向扩展请用独立服务名（如 app2:3000），而非 app:3001。
upstream nodejs_app {
    server app:3000;
    keepalive 64;
}

# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name _;
    
    # Cloudflare 健康检查
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# 主站 HTTPS 配置
server {
    listen 443 ssl http2;
    server_name openadult.com *.openadult.com;
    
    # === SSL 证书 (Cloudflare Origin Certificate) ===
    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # === 仅允许 Cloudflare IP 访问 ===
    # 定期从 https://www.cloudflare.com/ips/ 更新
    include /etc/nginx/conf.d/cloudflare-ips.conf;
    deny all;
    
    # === 安全头 ===
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # === 请求体大小限制 ===
    client_max_body_size 100m;  # 分片上传每片最大100MB
    
    # === 静态文件 (SPA) ===
    root /var/www/openadult/client/dist;
    index index.html;
    
    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        
        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # === API 反向代理 ===
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        
        proxy_pass http://nodejs_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        
        # 超时设置
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
    }
    
    # === 文件上传专用 (更大超时) ===
    location /api/upload {
        limit_req zone=upload burst=5 nodelay;
        
        client_max_body_size 500m;
        proxy_pass http://nodejs_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        
        # 上传需要更长超时
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # === 登录限流 ===
    location /api/oauth {
        limit_req zone=login burst=3 nodelay;
        
        proxy_pass http://nodejs_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }
    
    # === 存储代理 (S3 预签名重定向) ===
    location /manus-storage/ {
        proxy_pass http://nodejs_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        
        # 缓存预签名URL响应
        proxy_cache_valid 302 5m;
    }
    
    # === 禁止访问敏感路径 ===
    location ~ /\. {
        deny all;
    }
    location ~ ^/(\.env|package\.json|node_modules) {
        deny all;
    }
    
    # === 错误页面 ===
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/openadult/client/dist;
        internal;
    }
}

# ============================================================
# OpenAdult CDN 广告拼接节点 (OpenResty)
# 功能: 动态 m3u8 广告拼接 + .ts 片段代理 + 缓存
# 部署: 每个边缘节点一份 (东京、洛杉矶等)
#
# 该文件被挂载为 OpenResty 主配置。必须是完整、独立的 nginx 主配置：
# 需要 main 上下文的 worker_processes / events{}，其余指令必须位于 http{} 内。
# 挂载目标须为镜像实际加载的主配置路径
# (openresty/openresty:*-alpine 默认: /usr/local/openresty/nginx/conf/nginx.conf)。
# ============================================================

worker_processes auto;
error_log /dev/stderr warn;
pid /run/openresty.pid;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Lua 共享内存区域
    lua_shared_dict ad_cache 50m;       # 广告决策缓存
    lua_shared_dict m3u8_cache 100m;    # m3u8 播放列表缓存
    lua_shared_dict rate_limit 10m;     # 速率限制

    # Lua 包路径
    lua_package_path "/usr/local/openresty/lualib/?.lua;/etc/openresty/lua/?.lua;;";

    # DNS 解析器
    # NOTE: 上游 `app` 是 docker-compose 服务名，必须用 Docker 内嵌 DNS (127.0.0.11) 才能解析。
    # 若该节点独立部署于 compose 之外，请改回外部 DNS 并把 app 换成可达地址。
    resolver 127.0.0.11 ipv6=off valid=300s;
    resolver_timeout 5s;

    # 缓存配置 (http 上下文)
    proxy_cache_path /data/cache/video levels=1:2 keys_zone=video_cache:100m max_size=50g inactive=30d;
    proxy_cache_path /data/cache/ads   levels=1:2 keys_zone=ad_cache_disk:10m max_size=5g  inactive=7d;

    # 上游: S3 存储
    upstream s3_origin {
        server s3.us-west-002.backblazeb2.com:443;
        keepalive 32;
    }

    # 上游: 广告决策服务
    # NOTE: app 运行在独立容器；容器内 127.0.0.1 不通，必须用服务名 app:3000。
    upstream ad_decision {
        server app:3000;
        keepalive 16;
    }

    server {
        listen 443 ssl http2;
        server_name cdn.openadult.com cdn-*.openadult.com;

        ssl_certificate     /etc/openresty/ssl/cdn-origin.pem;
        ssl_certificate_key /etc/openresty/ssl/cdn-origin-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # === Master Playlist (动态广告拼接) ===
        location ~ ^/videos/([a-zA-Z0-9_-]+)/master\.m3u8$ {
            set $video_id $1;

            # 禁止缓存 (每次请求都需要动态拼接广告)
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Ad-Stitched "true";

            content_by_lua_file /etc/openresty/lua/ad_stitcher.lua;
        }

        # === 子播放列表 (带广告片段的 variant playlist) ===
        location ~ ^/videos/([a-zA-Z0-9_-]+)/(1080p|720p|480p|360p)/index\.m3u8$ {
            set $video_id $1;
            set $quality $2;

            add_header Cache-Control "no-cache, no-store, must-revalidate";
            content_by_lua_file /etc/openresty/lua/variant_stitcher.lua;
        }

        # === 正片 .ts 片段 (从 S3 代理 + 缓存) ===
        location ~ ^/videos/([a-zA-Z0-9_-]+)/(1080p|720p|480p|360p)/seg\d+\.ts$ {
            # 长时间缓存 (视频片段不变)
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;

            # 本地磁盘缓存
            proxy_cache video_cache;
            proxy_cache_valid 200 365d;
            proxy_cache_key "$uri";

            # 从 S3 获取
            proxy_pass https://s3_origin/openadult-media$uri;
            proxy_ssl_server_name on;
            proxy_set_header Host s3.us-west-002.backblazeb2.com;
        }

        # === 广告 .ts 片段 (从 S3 代理 + 缓存) ===
        location ~ ^/ads/([a-zA-Z0-9_-]+)/(1080p|720p|480p|360p)/seg\d+\.ts$ {
            # 广告片段也长期缓存
            add_header Cache-Control "public, max-age=86400";

            proxy_cache ad_cache_disk;
            proxy_cache_valid 200 24h;
            proxy_cache_key "$uri";

            proxy_pass https://s3_origin/openadult-media$uri;
            proxy_ssl_server_name on;
            proxy_set_header Host s3.us-west-002.backblazeb2.com;
        }

        # === HLS 加密密钥服务 ===
        location ~ ^/keys/([a-zA-Z0-9_-]+)$ {
            # 密钥不缓存
            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin "*";

            proxy_pass http://ad_decision/api/hls/key/$1;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # === 广告展示上报 ===
        location /api/ad-impression {
            # 异步日志记录，快速返回
            content_by_lua_block {
                local cjson = require "cjson"
                ngx.req.read_body()
                local body = ngx.req.get_body_data()

                -- 异步发送到后端 (容器内用服务名 app:3000)
                local httpc = require("resty.http").new()
                httpc:set_timeout(2000)

                ngx.timer.at(0, function(premature)
                    if premature then return end
                    local res, err = httpc:request_uri("http://app:3000/api/trpc/adManagement.recordImpression", {
                        method = "POST",
                        body = body,
                        headers = { ["Content-Type"] = "application/json" }
                    })
                end)

                -- 立即返回 204
                ngx.status = 204
                ngx.exit(204)
            }
        }

        # === 健康检查 ===
        location /health {
            content_by_lua_block {
                ngx.say("OK")
            }
        }
    }
}
